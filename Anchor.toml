[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
vault = "VAULTrDSUBZ8AXL2kGVYE8eKAn7tgWXRPAevNGUsyTV"

# Same id on both clusters — the vault is live on mainnet-beta too. `cluster` below stays
# devnet so a stray `anchor deploy` cannot reach mainnet by default.
[programs.mainnet]
vault = "VAULTrDSUBZ8AXL2kGVYE8eKAn7tgWXRPAevNGUsyTV"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "echo no ts tests"
