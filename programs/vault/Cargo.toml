[package]
name = "vault"
version = "0.1.0"
description = "An immutable multi-mint ledger primitive with ephemeral-rollup delegation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[features]
no-entrypoint = []

[dependencies]
solana-program = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
# the on-chain curve check: solana-pubkey's bytes_are_curve_point is unimplemented!()
# for target_os="solana", this one goes through the sol_curve_validate_point syscall
solana-curve25519 = "2"
ephemeral-rollups-sdk = { version = "0.14.4", features = ["modular-sdk", "access-control"] }
borsh = { version = "1", features = ["derive"] }

[dev-dependencies]
mollusk-svm = "0.15"
solana-account = "4"
solana-svm-log-collector = "4.2"
